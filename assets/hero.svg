<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0d17"/>
      <stop offset="0.55" stop-color="#15102b"/>
      <stop offset="1" stop-color="#1a0f2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a63f4"/>
      <stop offset="1" stop-color="#c77dff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6e40c9" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#6e40c9" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a63f4"/>
    </marker>
  </defs>

  <rect width="1280" height="420" fill="url(#bg)"/>
  <ellipse cx="900" cy="220" rx="420" ry="260" fill="url(#glow)"/>
  <circle cx="180" cy="70" r="2" fill="#8a63f4" opacity="0.5"/>
  <circle cx="1120" cy="350" r="2" fill="#c77dff" opacity="0.5"/>
  <circle cx="1180" cy="90" r="1.6" fill="#8a63f4" opacity="0.4"/>

  <!-- ===================== left: the SKILL ===================== -->
  <g transform="translate(120,150)">
    <rect x="0" y="0" width="150" height="170" rx="14" fill="#1c1733" stroke="#3a2f5c" stroke-width="1.5"/>
    <rect x="0" y="0" width="150" height="34" rx="14" fill="#241b40"/>
    <rect x="0" y="20" width="150" height="14" fill="#241b40"/>
    <circle cx="20" cy="17" r="4" fill="#c77dff"/>
    <text x="36" y="22" fill="#b9a6e8" font-size="13" font-weight="600">SKILL.md</text>
    <rect x="20" y="54" width="110" height="7" rx="3.5" fill="#4b3d77"/>
    <rect x="20" y="72" width="90" height="7" rx="3.5" fill="#3a2f5c"/>
    <rect x="20" y="90" width="100" height="7" rx="3.5" fill="#3a2f5c"/>
    <rect x="20" y="108" width="72" height="7" rx="3.5" fill="#3a2f5c"/>
    <rect x="20" y="132" width="110" height="7" rx="3.5" fill="#4b3d77"/>
    <rect x="20" y="150" width="84" height="7" rx="3.5" fill="#3a2f5c"/>
    <text x="75" y="200" fill="#6f6291" font-size="12" text-anchor="middle" letter-spacing="2">ONE AGENT</text>
  </g>

  <!-- ===================== middle: compile arrow ===================== -->
  <g transform="translate(300,235)">
    <line x1="0" y1="0" x2="150" y2="0" stroke="url(#accent)" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="75" y="-16" fill="#c77dff" font-size="13" text-anchor="middle" font-weight="600" letter-spacing="1">compile</text>
    <text x="75" y="26" fill="#6f6291" font-size="11" text-anchor="middle">decompose · verify</text>
  </g>

  <!-- ===================== right: the WORKFLOW DAG ===================== -->
  <g transform="translate(500,150)" stroke-linecap="round">
    <!-- edges: source -> 3 parallel -> merge -->
    <path d="M52,85 C110,85 110,30 168,30"  fill="none" stroke="#5a4a8f" stroke-width="2"/>
    <path d="M52,85 C110,85 110,85 168,85"  fill="none" stroke="#5a4a8f" stroke-width="2"/>
    <path d="M52,85 C110,85 110,140 168,140" fill="none" stroke="#5a4a8f" stroke-width="2"/>
    <path d="M220,30  C280,30 280,85 338,85"  fill="none" stroke="#5a4a8f" stroke-width="2"/>
    <path d="M220,85  C280,85 280,85 338,85"  fill="none" stroke="#5a4a8f" stroke-width="2"/>
    <path d="M220,140 C280,140 280,85 338,85" fill="none" stroke="#5a4a8f" stroke-width="2"/>

    <!-- source node -->
    <circle cx="36" cy="85" r="17" fill="#1c1733" stroke="url(#accent)" stroke-width="2.5"/>
    <circle cx="36" cy="85" r="5" fill="#c77dff"/>

    <!-- three parallel nodes (glow) -->
    <circle cx="194" cy="30"  r="20" fill="#6e40c9" opacity="0.9" filter="url(#soft)"/>
    <circle cx="194" cy="85"  r="20" fill="#6e40c9" opacity="0.9" filter="url(#soft)"/>
    <circle cx="194" cy="140" r="20" fill="#6e40c9" opacity="0.9" filter="url(#soft)"/>
    <circle cx="194" cy="30"  r="15" fill="#1c1733" stroke="#a07bf0" stroke-width="2"/>
    <circle cx="194" cy="85"  r="15" fill="#1c1733" stroke="#a07bf0" stroke-width="2"/>
    <circle cx="194" cy="140" r="15" fill="#1c1733" stroke="#a07bf0" stroke-width="2"/>

    <!-- merge node -->
    <circle cx="356" cy="85" r="18" fill="#1c1733" stroke="url(#accent)" stroke-width="2.5"/>
    <path d="M349,85 l5,5 l9,-11" fill="none" stroke="#c77dff" stroke-width="2.5" stroke-linejoin="round"/>

    <text x="194" y="195" fill="#6f6291" font-size="12" text-anchor="middle" letter-spacing="2">FAN-OUT · VERIFY · REDUCE</text>
  </g>

  <!-- ===================== wordmark ===================== -->
  <g transform="translate(120,360)">
    <text x="0" y="0" fill="#ffffff" font-size="34" font-weight="800" letter-spacing="-0.5">skill<tspan fill="#8a63f4">-to-</tspan>workflow</text>
  </g>
  <text x="1160" y="362" text-anchor="end" fill="#8f82b3" font-size="16" font-weight="500">Compile a Claude Agent Skill into a multi-agent Workflow</text>
</svg>
