<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="abg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#12101e"/>
    </linearGradient>
    <linearGradient id="aaccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a63f4"/>
      <stop offset="1" stop-color="#c77dff"/>
    </linearGradient>
    <marker id="aarrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a63f4"/>
    </marker>
    <marker id="aarrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e0934a"/>
    </marker>
  </defs>

  <rect width="1280" height="440" fill="url(#abg)"/>
  <text x="64" y="56" fill="#ffffff" font-size="22" font-weight="800">How it works</text>
  <text x="64" y="82" fill="#8f82b3" font-size="14">A five-phase meta-workflow. Each box is a group of subagents; the dashed arc is the adversarial repair loop.</text>

  <!-- phase boxes -->
  <g>
    <!-- 1 Ingest -->
    <g transform="translate(64,140)">
      <rect width="200" height="150" rx="14" fill="#171430" stroke="#3a2f5c" stroke-width="1.5"/>
      <rect width="200" height="40" rx="14" fill="#211a3d"/><rect y="22" width="200" height="18" fill="#211a3d"/>
      <text x="16" y="26" fill="#c77dff" font-size="14" font-weight="700">1 · Ingest</text>
      <text x="16" y="64" fill="#cdbff3" font-size="12.5">Read SKILL.md +</text>
      <text x="16" y="84" fill="#cdbff3" font-size="12.5">references + scripts</text>
      <text x="16" y="112" fill="#7e72a6" font-size="11.5">fan-out file reads</text>
      <text x="16" y="132" fill="#7e72a6" font-size="11.5">→ typed Skill IR</text>
    </g>
    <!-- 2 Decompose -->
    <g transform="translate(304,140)">
      <rect width="200" height="150" rx="14" fill="#171430" stroke="#3a2f5c" stroke-width="1.5"/>
      <rect width="200" height="40" rx="14" fill="#211a3d"/><rect y="22" width="200" height="18" fill="#211a3d"/>
      <text x="16" y="26" fill="#c77dff" font-size="14" font-weight="700">2 · Decompose</text>
      <text x="16" y="64" fill="#cdbff3" font-size="12.5">Classify every step:</text>
      <text x="16" y="86" fill="#9b8fc4" font-size="11.5">sequential · parallel</text>
      <text x="16" y="104" fill="#9b8fc4" font-size="11.5">pipeline · verify · reduce</text>
      <text x="16" y="132" fill="#7e72a6" font-size="11.5">→ orchestration plan</text>
    </g>
    <!-- 3 Synthesize -->
    <g transform="translate(544,140)">
      <rect width="200" height="150" rx="14" fill="#171430" stroke="#3a2f5c" stroke-width="1.5"/>
      <rect width="200" height="40" rx="14" fill="#211a3d"/><rect y="22" width="200" height="18" fill="#211a3d"/>
      <text x="16" y="26" fill="#c77dff" font-size="14" font-weight="700">3 · Synthesize</text>
      <text x="16" y="64" fill="#cdbff3" font-size="12.5">Generate the</text>
      <text x="16" y="84" fill="#cdbff3" font-size="12.5">workflow .js</text>
      <text x="16" y="112" fill="#7e72a6" font-size="11.5">embeds the authoring</text>
      <text x="16" y="132" fill="#7e72a6" font-size="11.5">spec for the agent</text>
    </g>
    <!-- 4 Verify -->
    <g transform="translate(784,140)">
      <rect width="200" height="150" rx="14" fill="#1a1330" stroke="#6e40c9" stroke-width="2"/>
      <rect width="200" height="40" rx="14" fill="#241640"/><rect y="22" width="200" height="18" fill="#241640"/>
      <text x="16" y="26" fill="#e0a3ff" font-size="14" font-weight="700">4 · Verify</text>
      <text x="16" y="62" fill="#cdbff3" font-size="11.5">3 adversarial lenses:</text>
      <text x="16" y="82" fill="#9b8fc4" font-size="11.5">syntax · fidelity</text>
      <text x="16" y="100" fill="#9b8fc4" font-size="11.5">parallel-soundness</text>
      <text x="16" y="132" fill="#e0934a" font-size="11.5">repair loop ↺ ×3</text>
    </g>
    <!-- 5 Emit -->
    <g transform="translate(1024,140)">
      <rect width="192" height="150" rx="14" fill="#171430" stroke="#3a2f5c" stroke-width="1.5"/>
      <rect width="192" height="40" rx="14" fill="#211a3d"/><rect y="22" width="192" height="18" fill="#211a3d"/>
      <text x="16" y="26" fill="#c77dff" font-size="14" font-weight="700">5 · Emit</text>
      <text x="16" y="64" fill="#cdbff3" font-size="12.5">Write workflow.js</text>
      <text x="16" y="84" fill="#cdbff3" font-size="12.5">+ node --check</text>
      <text x="16" y="112" fill="#7e72a6" font-size="11.5">+ CONVERSION-</text>
      <text x="16" y="132" fill="#7e72a6" font-size="11.5">REPORT.md</text>
    </g>
  </g>

  <!-- arrows between -->
  <line x1="266" y1="215" x2="302" y2="215" stroke="url(#aaccent)" stroke-width="2.5" marker-end="url(#aarrow)"/>
  <line x1="506" y1="215" x2="542" y2="215" stroke="url(#aaccent)" stroke-width="2.5" marker-end="url(#aarrow)"/>
  <line x1="746" y1="215" x2="782" y2="215" stroke="url(#aaccent)" stroke-width="2.5" marker-end="url(#aarrow)"/>
  <line x1="986" y1="215" x2="1022" y2="215" stroke="url(#aaccent)" stroke-width="2.5" marker-end="url(#aarrow)"/>

  <!-- repair loop arc: Verify back to Synthesize -->
  <path d="M884,290 C884,360 644,360 644,292" fill="none" stroke="#e0934a" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#aarrow2)"/>
  <text x="764" y="382" fill="#e0934a" font-size="12" text-anchor="middle" font-weight="600">issues → regenerate</text>

  <!-- input/output chips -->
  <text x="64" y="324" fill="#7e72a6" font-size="12">in:  a Skill directory</text>
  <text x="1216" y="324" fill="#7e72a6" font-size="12" text-anchor="end">out: a verified Workflow</text>
</svg>
