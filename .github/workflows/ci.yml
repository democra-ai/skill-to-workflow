name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax-check the meta-workflow engine
        run: node --check workflows/skill-to-workflow.js
      - name: Syntax-check generated example workflow(s)
        run: |
          shopt -s nullglob
          for f in examples/output-workflow/*.js; do
            echo "node --check $f"
            node --check "$f"
          done
      - name: Validate installer + package.json
        run: |
          node --check bin/install.mjs
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'))"
